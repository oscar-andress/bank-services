spring.application.name=authentication-service

# Server
server.port=8087

# Key cloack config
keycloak.realm=bank-microservices-realm
keycloak.auth-server-url=http://keycloak-service:8080
keycloak.ssl-required=external
keycloak.client-id=authentication-service
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak-service:8080/realms/bank-microservices-realm

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Zipkin/Tempo
management.zipkin.tracing.endpoint=http://tempo:9411/api/v2/spans
management.tracing.sampling.probability=1.0

# Logging pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level traceId=%X{traceId} spanId=%X{spanId} %logger - %msg%n
