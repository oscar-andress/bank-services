spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: authentication-service
              uri: http://authentication-service:8087
              predicates:
                - Path=/bank/api/v1/auth/client
              filters:
              - name: RequestRateLimiter
                args:
                  redis-rate-limiter.replenishRate: 1
                  redis-rate-limiter.burstCapacity: 5
                  redis-rate-limiter.requestedTokens: 1
                  keyresolver: "#{@ipKeyResolver}"
            - id: client-person
              uri: http://client-person-service:8083
              predicates:
                - Path=/bank/api/v1/client/**
              filters:
              - name: RequestRateLimiter
                args:
                  redis-rate-limiter.replenishRate: 5
                  redis-rate-limiter.burstCapacity: 10
                  redis-rate-limiter.requestedTokens: 1
                  keyresolver: "#{@tokenKeyResolver}"

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak-service:8080/realms/bank-microservices-realm
  
  data:
    redis:
      host: redis-service
      port: 6379
      timeout: 2s

management:
  endpoints:
    web:
      exposure:
        include: "*"
  zipkin:
    tracing:
      endpoint: "http://tempo:9411/api/v2/spans"
  endpoint:
    health:
      show:
        details: "always"
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
  tracing:
    sampling:
      probability: 1.0

server:
  port: 8088

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level traceId=%X{traceId} spanId=%X{spanId} %logger - %msg%n"
